version: "3.9"

services:
  # ==========================================
  # 1. DATABASE SERVICE (PostgreSQL 16)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: ayojit_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayojit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayojit_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ayojit_lms}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - ayo_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayojit} -d ${POSTGRES_DB:-ayojit_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. IN-MEMORY CACHE & LOCKS (Redis 7)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ayojit_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - ayo_internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==========================================
  # 3. LITERATURE SEARCH ENGINE (Python 3.11)
  # ==========================================
  paperfetcher:
    build:
      context: ./paperfetcher_service
      dockerfile: Dockerfile
    image: ayojit-paperfetcher:prod
    container_name: ayojit_prod_paperfetcher
    restart: always
    environment:
      PORT: 5000
      PYTHONUNBUFFERED: 1
    networks:
      - ayo_internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 4. MAIN LMS WEB APPLICATION (Next.js 14)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ayojit-web:prod
    container_name: ayojit_prod_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      paperfetcher:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayojit}:${POSTGRES_PASSWORD:-ayojit_secure_password_2026}@db:5432/${POSTGRES_DB:-ayojit_lms}?schema=public
      REDIS_URL: redis://redis:6379
      PAPERFETCHER_API_URL: http://paperfetcher:5000/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ayojitintelligence.com}
      CANONICAL_HOST: ${CANONICAL_HOST:-ayojitintelligence.com}
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - app_prod_storage:/app/storage
      - app_prod_uploads:/app/public/uploads
    networks:
      - ayo_internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================
  # 5. REVERSE PROXY & GATEWAY (Nginx 1.25)
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ayojit_prod_nginx
    restart: always
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - app_prod_uploads:/app/public/uploads:ro
    networks:
      - ayo_internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  ayo_internal_net:
    driver: bridge
    name: ayo_internal_net

volumes:
  postgres_prod_data:
    name: ayojit_postgres_prod_data
  redis_prod_data:
    name: ayojit_redis_prod_data
  app_prod_storage:
    name: ayojit_app_prod_storage
  app_prod_uploads:
    name: ayojit_app_prod_uploads
